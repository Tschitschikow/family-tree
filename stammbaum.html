<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stammbaum – Bahrs Familie</title>
    <link rel="stylesheet" href="shared.css">
    <style>
        body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* ── Stammbaum-Layout ─────────────────────────────── */
        #tree-main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }
        #tree-setup {
            width: 280px; min-width: 260px;
            background: #fff; border-right: 1px solid #e0d4c4;
            padding: 1.4em 1.2em; overflow-y: auto;
            display: flex; flex-direction: column; gap: 1em;
            box-shadow: 2px 0 8px rgba(0,0,0,0.06);
        }
        #tree-setup h3 {
            font-family: Georgia, serif; color: #5a3e2b;
            font-size: 1em; margin: 0 0 0.2em 0;
            border-bottom: 1px solid #e8d8c4; padding-bottom: 0.4em;
        }
        .tree-step { display: none; flex-direction: column; gap: 0.5em; }
        .tree-step.active { display: flex; }
        .tree-step label { font-size: 0.85em; color: #5a3e2b; font-weight: 600; }
        .tree-step p { font-size: 0.78em; color: #888; margin: 0; line-height: 1.4; }
        .tree-step select, .tree-step input[type=text] {
            font-family: Georgia, serif; font-size: 0.9em;
            padding: 0.4em 0.5em; border: 1px solid #ccc;
            border-radius: 5px; width: 100%;
        }
        .tree-btn-row { display: flex; gap: 8px; margin-top: 0.3em; }
        .tree-btn-primary {
            flex: 1; padding: 0.5em 0.8em;
            background: #5a3e2b; color: white; border: none;
            border-radius: 6px; font-family: Georgia, serif;
            font-size: 0.9em; cursor: pointer;
        }
        .tree-btn-primary:hover { background: #7a5e4b; }
        .tree-btn-secondary {
            padding: 0.5em 0.8em; background: white;
            color: #5a3e2b; border: 1px solid #c8b49a;
            border-radius: 6px; font-family: Georgia, serif;
            font-size: 0.9em; cursor: pointer;
        }
        .tree-btn-secondary:hover { background: #f8f0e8; }

        /* Zeichenfläche */
        #tree-canvas { flex: 1; position: relative; overflow: hidden; background: #fafafa; }
        #tree-svg { width: 100%; height: 100%; cursor: default; }
        #tree-export-btn {
            position: absolute; bottom: 18px; right: 18px;
            padding: 0.5em 1.1em; background: #5a3e2b; color: white;
            border: none; border-radius: 6px; font-family: Georgia, serif;
            font-size: 0.85em; cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.18); display: none;
        }
        #tree-export-btn:hover { background: #7a5e4b; }
        #tree-anchor-name { font-size: 0.82em; color: #5a3e2b; font-weight: bold; min-height: 1.2em; }

        /* Ladebalken */
        #loading { text-align: center; padding: 3em; color: #aaa; }
    </style>
</head>
<body>

<!-- ── Header ──────────────────────────────────────────── -->
<header>
    <h1>🌳 Bahrs Familienstammbaum</h1>
    <nav>
        <a href="admin.html" id="admin-btn">🔐 Admin</a>
        <div id="view-menu-wrap">
            <button id="view-menu-btn">Ansicht</button>
            <div id="view-dropdown">
                <div class="vd-item" data-view="timeline"><span class="vd-icon">📅</span> Zeitleiste</div>
                <div class="vd-item" data-view="network"><span class="vd-icon">🕸️</span> Dynamisches Netzwerk</div>
                <div class="vd-item active-view" data-view="stammbaum"><span class="vd-icon">🌳</span> Klassischer Stammbaum</div>
                <div class="vd-item" data-view="register"><span class="vd-icon">📋</span> Register</div>
                <div class="vd-item" data-view="karte"><span class="vd-icon">🗺️</span> Karte</div>
            </div>
        </div>
        <button id="logout-btn">Ausloggen</button>
    </nav>
</header>

<div id="loading">Lade Stammbaum...</div>

<!-- ── Hauptbereich ────────────────────────────────────── -->
<div id="tree-main" style="display:none;">
    <!-- Linkes Panel -->
    <div id="tree-setup">
        <h3>🌳 Stammbaum</h3>

        <!-- Schritt 1: Startperson -->
        <div class="tree-step active" id="tree-step-1">
            <label>Startperson wählen</label>
            <p>Person erscheint in der Mitte. Ehepartner werden automatisch daneben platziert.</p>
            <input type="text" id="tree-anchor-search" placeholder="Name suchen…" autocomplete="off"/>
            <select id="tree-anchor-select" size="10" style="height:200px;"></select>
            <div id="tree-anchor-name"></div>
            <div class="tree-btn-row">
                <button class="tree-btn-primary" id="tree-step1-next">Anzeigen →</button>
            </div>
        </div>

        <!-- Kontextmenü nach Klick -->
        <div class="tree-step" id="tree-ctx-menu">
            <label id="tree-ctx-name" style="font-size:0.9em;color:#5a3e2b;"></label>
            <p id="tree-ctx-info" style="font-size:0.78em;color:#888;"></p>
            <div style="display:flex;flex-direction:column;gap:6px;margin-top:0.4em;">
                <button class="tree-btn-primary" id="tree-ctx-up">↑ Vorfahren anzeigen</button>
                <button class="tree-btn-primary" id="tree-ctx-down">↓ Nachkommen anzeigen</button>
                <button class="tree-btn-secondary" id="tree-ctx-close">Schließen</button>
            </div>
        </div>
    </div>

    <!-- SVG-Zeichenfläche -->
    <div id="tree-canvas">
        <svg id="tree-svg" xmlns="http://www.w3.org/2000/svg">
            <g id="tree-g"></g>
        </svg>
        <button id="tree-export-btn">💾 SVG exportieren</button>
    </div>
</div>

<!-- ── Scripts ──────────────────────────────────────────── -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="shared.js"></script>
<script>
// ══════════════════════════════════════════════════════
// Stammbaum – eigene Logik
// ══════════════════════════════════════════════════════

var treeAnchorId = null;

// ════════════════════════════════════════════════════
// ── SVG Stammbaum ───────────────────────────────────
// ════════════════════════════════════════════════════

// Konstanten
var TW = 130, TH = 52;          // Node-Breite/-Höhe
var SPOUSE_GAP = 28;            // Abstand zwischen Ehepartnern
var LEVEL_H = 130;              // Höhe pro Ebene
var svgNS = 'http://www.w3.org/2000/svg';

// State
var treeNodes = {};             // id → {x,y,id,label,sex,famColor,spouseIds,el}
var treeEdges = [];             // [{from,to,type,el}]
var treeAnchorSvgId = null;
var svgPan = {x:0, y:0, scale:1};
var svgDrag = null;

function getSvg()  { return document.getElementById('tree-svg'); }
function getGroup(){ return document.getElementById('tree-g'); }

// ── Hilfsfunktionen ──────────────────────────────────
function personById(id) {
    return allPersons.find(function(p){ return p.id === id; });
}
function spousesOf(id) {
    var ids = [];
    allRels.forEach(function(r){
        if ((r.relationship_type === 'hasWife' || r.relationship_type === 'hasHusband') &&
            r.person_id === id) ids.push(r.related_person_id);
    });
    return ids;
}
function nodeLabel(p) {
    if (!p) return '?';
    var fn = p.family_name ? p.family_name.charAt(0)+p.family_name.slice(1).toLowerCase() : '';
    var gn = p.given_name || '';
    var yr = p.birth_date ? p.birth_date.substring(0,4) : '';
    var dy = p.death_date ? p.death_date.substring(0,4) : '';
    var line1 = gn || fn;
    var line2 = gn ? fn : '';
    var line3 = yr ? ('*'+yr + (dy?' †'+dy:'')) : '';
    return [line1, line2, line3].filter(Boolean);
}

// ── SVG-Element erzeugen ─────────────────────────────
function makeSvgNode(p, x, y, isAnchor) {
    var g = document.createElementNS(svgNS, 'g');
    g.setAttribute('class','tree-node');
    g.setAttribute('data-id', p.id);
    g.style.cursor = 'pointer';

    var shape;
    if (p.sex === 'f') {
        shape = document.createElementNS(svgNS, 'ellipse');
        shape.setAttribute('rx', TW/2);
        shape.setAttribute('ry', TH/2);
        shape.setAttribute('cx', 0);
        shape.setAttribute('cy', 0);
    } else {
        shape = document.createElementNS(svgNS, 'rect');
        shape.setAttribute('x', -TW/2);
        shape.setAttribute('y', -TH/2);
        shape.setAttribute('width', TW);
        shape.setAttribute('height', TH);
        shape.setAttribute('rx', 7);
    }
    shape.setAttribute('fill', '#fff');
    shape.setAttribute('stroke', getFamilyColor(p.family_name));
    shape.setAttribute('stroke-width', isAnchor ? 3.5 : 2);
    g.appendChild(shape);

    var lines = nodeLabel(p);
    var lineH = 13;
    var totalH = lines.length * lineH;
    var startY = -(totalH/2) + lineH/2;
    lines.forEach(function(line, i) {
        var txt = document.createElementNS(svgNS, 'text');
        txt.setAttribute('x', 0);
        txt.setAttribute('y', startY + i*lineH);
        txt.setAttribute('text-anchor', 'middle');
        txt.setAttribute('dominant-baseline', 'middle');
        txt.setAttribute('font-family', 'Helvetica Neue, Arial, sans-serif');
        txt.setAttribute('font-size', i===0 ? '9' : '7.5');
        txt.setAttribute('fill', i===0 ? '#222' : '#666');
        if (i===0) txt.setAttribute('font-weight','600');
        txt.textContent = line;
        g.appendChild(txt);
    });

    g.setAttribute('transform','translate('+x+','+y+')');
    g.addEventListener('click', function(e){
        e.stopPropagation();
        openCtxMenu(p.id);
    });

    getGroup().appendChild(g);
    treeNodes[p.id] = { id:p.id, x:x, y:y, el:g, p:p };
    return g;
}

function makeSvgEdge(x1,y1,x2,y2,type) {
    var line = document.createElementNS(svgNS, 'line');
    line.setAttribute('x1',x1); line.setAttribute('y1',y1);
    line.setAttribute('x2',x2); line.setAttribute('y2',y2);
    if (type === 'spouse') {
        line.setAttribute('stroke','#c8a020');
        line.setAttribute('stroke-width','2');
    } else if (type === 'parent') {
        line.setAttribute('stroke','#666');
        line.setAttribute('stroke-width','1.2');
    } else {
        line.setAttribute('stroke','#aaa');
        line.setAttribute('stroke-width','1');
    }
    // Kante vor Nodes einfügen (Nodes obendrüber)
    var g = getGroup();
    g.insertBefore(line, g.firstChild);
    return line;
}

// Ehe-Verbindungspunkt (goldener Punkt zwischen Ehepartnern)
function makeSpouseConnector(p1id, p2id) {
    var n1 = treeNodes[p1id], n2 = treeNodes[p2id];
    if (!n1 || !n2) return;
    var mx = (n1.x + n2.x) / 2;
    var my = n1.y;
    makeSvgEdge(n1.x, n1.y, n2.x, n2.y, 'spouse');
    // goldener Punkt
    var dot = document.createElementNS(svgNS, 'circle');
    dot.setAttribute('cx', mx);
    dot.setAttribute('cy', my);
    dot.setAttribute('r', 5);
    dot.setAttribute('fill', '#e8c84a');
    dot.setAttribute('stroke', '#fff');
    dot.setAttribute('stroke-width', '1.5');
    getGroup().appendChild(dot);
}

// ── SVG Pan & Zoom ───────────────────────────────────
function updateTransform() {
    getGroup().setAttribute('transform',
        'translate('+svgPan.x+','+svgPan.y+') scale('+svgPan.scale+')');
}

function initSvgInteraction() {
    var svg = getSvg();
    var dragging = false, startX, startY, startPX, startPY;
    svg.addEventListener('mousedown', function(e) {
        if (e.target.closest('.tree-node')) return;
        dragging = true;
        startX = e.clientX; startY = e.clientY;
        startPX = svgPan.x; startPY = svgPan.y;
        svg.style.cursor = 'grabbing';
    });
    window.addEventListener('mousemove', function(e) {
        if (!dragging) return;
        svgPan.x = startPX + (e.clientX - startX);
        svgPan.y = startPY + (e.clientY - startY);
        updateTransform();
    });
    window.addEventListener('mouseup', function() {
        dragging = false;
        getSvg().style.cursor = 'default';
    });
    svg.addEventListener('wheel', function(e) {
        e.preventDefault();
        var factor = e.deltaY < 0 ? 1.1 : 0.9;
        var rect = svg.getBoundingClientRect();
        var mx = e.clientX - rect.left;
        var my = e.clientY - rect.top;
        svgPan.x = mx - (mx - svgPan.x) * factor;
        svgPan.y = my - (my - svgPan.y) * factor;
        svgPan.scale *= factor;
        updateTransform();
    }, {passive:false});
}

// ── Startperson platzieren ───────────────────────────
function placeFamilyUnit(anchorId, centerX, centerY) {
    var anchor = personById(anchorId);
    if (!anchor) return;

    var spouseIds = spousesOf(anchorId);
    var total = 1 + spouseIds.length;
    var unitW = total * TW + (total-1) * SPOUSE_GAP;
    var startX = centerX - unitW/2 + TW/2;

    makeSvgNode(anchor, startX, centerY, true);

    var curX = startX + TW + SPOUSE_GAP;
    spouseIds.forEach(function(sid) {
        var sp = personById(sid);
        if (!sp) return;
        makeSvgNode(sp, curX, centerY, false);
        makeSpouseConnector(anchorId, sid);
        curX += TW + SPOUSE_GAP;
    });

    treeAnchorSvgId = anchorId;
    document.getElementById('tree-export-btn').style.display = 'block';
}

function svgCenter() {
    var svg = getSvg();
    var r = svg.getBoundingClientRect();
    // In SVG-Koordinaten umrechnen
    var cx = (r.width/2  - svgPan.x) / svgPan.scale;
    var cy = (r.height/2 - svgPan.y) / svgPan.scale;
    return {x: cx, y: cy};
}

// ── Kontextmenü ──────────────────────────────────────
function openCtxMenu(personId) {
    var p = personById(personId);
    if (!p) return;

    document.getElementById('tree-ctx-name').textContent = p.display_name;
    var yr = p.birth_date ? '*'+p.birth_date.substring(0,4) : '';
    var dy = p.death_date ? ' †'+p.death_date.substring(0,4) : '';
    document.getElementById('tree-ctx-info').textContent = yr + dy + (p.profession ? '  '+p.profession : '');

    // Buttons aktivieren
    document.getElementById('tree-ctx-up').onclick = function() {
        expandUp(personId);
        closeCtxMenu();
    };
    document.getElementById('tree-ctx-down').onclick = function() {
        expandDown(personId);
        closeCtxMenu();
    };

    // Schritt-1 ausblenden, Kontextmenü einblenden
    document.getElementById('tree-step-1').classList.remove('active');
    document.getElementById('tree-ctx-menu').classList.add('active');
}

function closeCtxMenu() {
    document.getElementById('tree-ctx-menu').classList.remove('active');
}

document.getElementById('tree-ctx-close').addEventListener('click', closeCtxMenu);

// ── Vorfahren aufklappen ─────────────────────────────
function expandUp(childId) {
    var childNode = treeNodes[childId];
    if (!childNode) return;

    var parentIds = [];
    allRels.forEach(function(r) {
        if ((r.relationship_type === 'hasMother' || r.relationship_type === 'hasFather') &&
            r.person_id === childId) {
            parentIds.push(r.related_person_id);
        }
    });
    if (parentIds.length === 0) {
        alert('Keine Eltern bekannt.'); return;
    }

    var targetY = childNode.y - LEVEL_H;
    // Paare gruppieren
    var pairs = groupIntoPairs(parentIds);
    var totalUnitsW = pairs.reduce(function(s,pair){
        return s + pair.length * TW + (pair.length-1)*SPOUSE_GAP;
    }, 0) + Math.max(0, pairs.length-1) * (TW + SPOUSE_GAP);
    var startX = childNode.x - totalUnitsW/2;

    var connectionPoints = []; // x-Koordinaten der Eltern-Knoten

    pairs.forEach(function(pair) {
        var unitW = pair.length * TW + (pair.length-1)*SPOUSE_GAP;
        var cx = startX + unitW/2;
        startX += unitW + TW + SPOUSE_GAP;

        pair.forEach(function(pid, i) {
            if (treeNodes[pid]) return;
            var px = cx - (pair.length===2 ? (TW/2+SPOUSE_GAP/2) : 0) + i*(TW+SPOUSE_GAP);
            var p = personById(pid);
            if (p) {
                makeSvgNode(p, px, targetY, false);
                connectionPoints.push(px);
            }
        });
        if (pair.length === 2 && !treeNodes[pair[0]] && !treeNodes[pair[1]]) {
            makeSpouseConnector(pair[0], pair[1]);
        }
    });

    // Linien von Eltern zum Kind
    var midChildX = childNode.x;
    connectionPoints.forEach(function(px) {
        makeSvgEdge(px, targetY + TH/2, midChildX, childNode.y - TH/2, 'parent');
    });
}

// ── Nachkommen aufklappen ────────────────────────────
function expandDown(parentId) {
    var parentNode = treeNodes[parentId];
    if (!parentNode) return;

    var childIds = [];
    allRels.forEach(function(r) {
        if ((r.relationship_type === 'hasMother' || r.relationship_type === 'hasFather') &&
            r.related_person_id === parentId) {
            childIds.push(r.person_id);
        }
    });
    if (childIds.length === 0) {
        alert('Keine Kinder bekannt.'); return;
    }

    var targetY = parentNode.y + LEVEL_H;
    var totalW = childIds.length * TW + (childIds.length-1) * SPOUSE_GAP;
    var startX = parentNode.x - totalW/2 + TW/2;

    childIds.forEach(function(cid) {
        if (treeNodes[cid]) return;
        var p = personById(cid);
        if (p) {
            makeSvgNode(p, startX, targetY, false);
            makeSvgEdge(parentNode.x, parentNode.y + TH/2, startX, targetY - TH/2, 'parent');
            startX += TW + SPOUSE_GAP;
        }
    });
}

// Hilfsfunktion: Eltern in Paare gruppieren
function groupIntoPairs(ids) {
    var used = new Set();
    var pairs = [];
    ids.forEach(function(id) {
        if (used.has(id)) return;
        var spIds = spousesOf(id).filter(function(s){ return ids.indexOf(s) >= 0; });
        if (spIds.length > 0) {
            pairs.push([id, spIds[0]]);
            used.add(id); used.add(spIds[0]);
        } else {
            pairs.push([id]);
            used.add(id);
        }
    });
    return pairs;
}

// ── Step-Navigation ──────────────────────────────────
document.getElementById('tree-step1-next').addEventListener('click', function() {
    if (!treeAnchorId) { alert('Bitte eine Person wählen.'); return; }
    // Graph leeren
    getGroup().innerHTML = '';
    treeNodes = {}; treeEdges = [];
    // SVG zentrieren
    var svg = getSvg();
    var r = svg.getBoundingClientRect();
    svgPan = { x: r.width/2, y: r.height/2, scale: 1 };
    updateTransform();
    // Startperson platzieren (im Koordinatenursprung)
    placeFamilyUnit(treeAnchorId, 0, 0);
    initSvgInteraction();
});

// tree-close-btn: Navigation über Dropdown

// Anchor-Suche (aus bestehendem Code)
function fillTreeAnchor(filter) {
    var sel = document.getElementById('tree-anchor-select');
    sel.innerHTML = '';
    var sorted = allPersons.slice().sort(function(a,b){
        return a.display_name.localeCompare(b.display_name);
    });
    var q = (filter||'').trim().toLowerCase();
    sorted.forEach(function(p) {
        if (q && p.display_name.toLowerCase().indexOf(q) < 0 &&
                 (p.given_name||'').toLowerCase().indexOf(q) < 0) return;
        var opt = document.createElement('option');
        opt.value = p.id;
        var year = p.birth_date ? p.birth_date.substring(0,4) : '?';
        opt.textContent = p.display_name + ' (*'+year+')';
        sel.appendChild(opt);
    });
}
document.getElementById('tree-anchor-search').addEventListener('input', function(){
    fillTreeAnchor(this.value);
});
document.getElementById('tree-anchor-select').addEventListener('change', function(){
    treeAnchorId = parseInt(this.value);
    var p = allPersons.find(function(x){ return x.id === treeAnchorId; });
    document.getElementById('tree-anchor-name').textContent = p ? p.display_name : '';
});

// openTreeOverlay bleibt nutzbar
function openTreeOverlay() {
    // tree-overlay: Seite ist direkt sichtbar (kein Overlay)
    document.getElementById('tree-step-1').classList.add('active');
    document.getElementById('tree-ctx-menu').classList.remove('active');
    fillTreeAnchor('');
    treeAnchorId = null;
    document.getElementById('tree-anchor-name').textContent = '';
    document.getElementById('tree-anchor-search').value = '';
}

    // PNG-Export
document.getElementById('tree-export-btn').addEventListener('click', function() {
    if (!treeCy) return;
    var png = treeCy.png({ full: true, scale: 2, bg: '#f0f0f0' });
    var a = document.createElement('a');
    a.href = png;
    a.download = 'stammbaum_' + new Date().toISOString().substring(0, 10) + '.png';
    a.click();
});

// ── Init ────────────────────────────────────────────
window.addEventListener('load', function() {
    setupLogout();
    setupViewMenu();
    initPage(function() {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('tree-main').style.display = 'flex';
        fillTreeAnchor('');
    });
});
</script>
</body>
</html>
