<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamisches Netzwerk – Bahrs Familie</title>
    <link rel="stylesheet" href="shared.css">
    <style>
        body { display:flex; flex-direction:column; height:100vh; overflow:hidden; }
        #loading { text-align:center; padding:3em; color:#aaa; }
        #main { flex:1; display:none; overflow:hidden; }
        #main { display:none; }

        /* ── Dreispaltiges Layout ──────────────────── */
        #content { display:flex; flex:1; overflow:hidden; }
        #legend {
            width:160px; min-width:140px; flex-shrink:0;
            background:#fff; border-right:1px solid #e8e8e8;
            padding:0.6em 0.7em; font-size:0.78em; overflow-y:auto;
        }
        #legend h4 { font-size:0.88em; font-weight:600; color:#334; margin:0 0 0.4em; padding-bottom:0.3em; border-bottom:1px solid #eef; }
        .legend-controls { display:flex; gap:6px; margin-bottom:0.4em; }
        .legend-ctrl-btn { flex:1; font-size:0.82em; padding:0.2em 0.3em; background:#f0f2f5; border:1px solid #dde; border-radius:4px; cursor:pointer; font-family:inherit; color:#445; }
        .legend-ctrl-btn:hover { background:#e4e8f0; }

        #graph-area { flex:1; position:relative; background:#f8f8f8; }
        #cola-cy { position:absolute; top:0; left:0; right:0; bottom:0; }

        #details {
            width:270px; flex-shrink:0; background:#fff;
            border-left:1px solid #dde; padding:1em; overflow-y:auto;
            font-family:'Helvetica Neue',Arial,sans-serif; font-size:0.82em; color:#445;
        }
        #details h3 { font-size:0.95em; font-weight:600; color:#223; margin:0 0 0.5em; border-bottom:1px solid #eef; padding-bottom:0.3em; }
    </style>
</head>
<body>

<!-- ── Header ──────────────────────────────────────── -->
<header>
    <h1>🌳 Bahrs Familienstammbaum</h1>
    <nav>
        <a href="admin.html" id="admin-btn" style="display:none;color:white;font-size:0.85em;text-decoration:none;background:rgba(200,150,12,0.4);border:1px solid rgba(200,150,12,0.7);padding:0.35em 0.9em;border-radius:5px;">🔐 Admin</a>
        <div id="view-menu-wrap">
            <button id="view-menu-btn">Ansicht</button>
            <div id="view-dropdown">
                <a href="index.html" class="vd-item" data-view="timeline" style="text-decoration:none;"><span class="vd-icon">📅</span> Zeitleiste</a>
                <a href="netzwerk.html" class="vd-item active-view" data-view="network" style="text-decoration:none;"><span class="vd-icon">🕸️</span> Dynamisches Netzwerk</a>
                <a href="stammbaum.html" class="vd-item" data-view="stammbaum" style="text-decoration:none;"><span class="vd-icon">🌳</span> Klassischer Stammbaum</a>
                <a href="register.html" class="vd-item" data-view="register" style="text-decoration:none;"><span class="vd-icon">📋</span> Register</a>
                <a href="karte.html" class="vd-item" data-view="karte" style="text-decoration:none;"><span class="vd-icon">🗺️</span> Karte</a>
            </div>
        </div>
        <button id="logout-btn">Ausloggen</button>
    </nav>
</header>

<!-- ── Toolbar (wird von shared.js buildToolbar befüllt) ── -->
<div id="toolbar"></div>

<!-- ── Ladebalken ──────────────────────────────────── -->
<div id="loading">Lade Netzwerk...</div>

<!-- ── Hauptbereich ────────────────────────────────── -->
<div id="main">
    <div id="content">
        <div id="legend">
            <h4>🎨 Familiennamen</h4>
            <div class="legend-controls">
                <button class="legend-ctrl-btn" id="legend-all">Alle</button>
                <span style="color:#e0e0e0">|</span>
                <button class="legend-ctrl-btn" id="legend-none">Keine</button>
            </div>
            <div id="legend-items"></div>
        </div>
        <div id="graph-area">
            <div id="cola-cy"></div>
        </div>
        <div id="details">
            <h3>Details</h3>
            <p id="details-hint" style="color:#888;font-style:italic;font-size:0.85em;">Knoten anklicken.</p>
            <div id="details-content"></div>
        </div>
    </div>
</div>

<!-- ── Scripts ──────────────────────────────────────── -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cytoscape-cola@2.5.1/cytoscape-cola.js"></script>
<script src="config.js"></script>
<script src="shared.js?v=1780938873"></script>
<script>
/* ══════════════════════════════════════════════════════
   Dynamisches Netzwerk – sauber neu aufgebaut
   ══════════════════════════════════════════════════════ */

window.addEventListener('load', function() {

    var colaCy = null;

    setupLogout();
    setupViewMenu();

    initPage(function() {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('main').style.display = 'flex';

        // 1. Toolbar aus shared.js
        buildToolbar('toolbar');

        // 2. Familienlegende (VOR Graph, damit Farben stimmen)
        buildFamilyLegend('legend-items', 'legend-all', 'legend-none', function() {
            applyFamilyFilter();
        });

        // 3. Graph aufbauen
        buildGraph();

        // 4. Toolbar-Handler
        setupToolbarHandlers(colaCy, {
            onRefit: function() {
                applyFamilyFilter();
                colaCy.layout({
                    name: 'cose', animate: true, padding: 60,
                    nodeRepulsion: 480000, idealEdgeLength: 120,
                    randomize: true, fit: true,
                }).run();
            },
            onReset: function() {
                applyFamilyFilter();
            }
        });
    });

    // ══════════════════════════════════════════════════
    // Graph aufbauen
    // ══════════════════════════════════════════════════
    function buildGraph() {
        var nodes = [];
        var edges = [];
        var edgeSet = {};

        // ── Nodes ────────────────────────────────────
        allPersons.forEach(function(p) {
            var year  = p.birth_date ? p.birth_date.substring(0, 4) : '';
            var dyear = p.death_date ? p.death_date.substring(0, 4) : '';
            var fn = p.family_name || '';
            var gn = p.given_name || '';
            var label = gn + '\n' + fn;
            if (year) label += '\n*' + year + (dyear ? '  †' + dyear : '');

            nodes.push({ group: 'nodes', data: {
                id:          String(p.id),
                label:       label,
                sex:         p.sex,
                raw:         p,
                family_name: p.family_name || '',
                maiden_name: p.maiden_name || '',
                famColor:    getFamilyColor(p.family_name),
            }});
        });

        // ── Edges (Eltern, Ehe) ──────────────────────
        allRels.forEach(function(r) {
            var t = r.relationship_type;
            var src = String(r.person_id);
            var tgt = String(r.related_person_id);
            var key, etype;

            if (t === 'hasWife' || t === 'hasHusband') {
                key = Math.min(r.person_id, r.related_person_id) + '_' + Math.max(r.person_id, r.related_person_id) + '_m';
                etype = 'married';
            } else if (t === 'hasExWife' || t === 'hasExHusband') {
                key = Math.min(r.person_id, r.related_person_id) + '_' + Math.max(r.person_id, r.related_person_id) + '_ex';
                etype = 'exmarried';
            } else if (t === 'hasMother' || t === 'hasFather') {
                key = src + '_' + tgt + '_' + t;
                etype = 'parent';
            } else {
                return;
            }
            if (edgeSet[key]) return;
            edgeSet[key] = true;
            edges.push({ group: 'edges', data: { id: key, source: src, target: tgt, type: etype } });
        });

        // ── Geschwister-Kanten ───────────────────────
        var childParents = {};
        allRels.forEach(function(r) {
            var cid = String(r.person_id);
            if (r.relationship_type === 'hasMother') {
                if (!childParents[cid]) childParents[cid] = { mothers: [], fathers: [] };
                childParents[cid].mothers.push(String(r.related_person_id));
            }
            if (r.relationship_type === 'hasFather') {
                if (!childParents[cid]) childParents[cid] = { mothers: [], fathers: [] };
                childParents[cid].fathers.push(String(r.related_person_id));
            }
        });
        var childIds = Object.keys(childParents);
        for (var ci = 0; ci < childIds.length; ci++) {
            for (var cj = ci + 1; cj < childIds.length; cj++) {
                var a = childIds[ci], b = childIds[cj];
                var pa = childParents[a], pb = childParents[b];
                var sharedM = pa.mothers.some(function(m) { return pb.mothers.indexOf(m) >= 0; });
                var sharedF = pa.fathers.some(function(f) { return pb.fathers.indexOf(f) >= 0; });
                if (sharedM || sharedF) {
                    var sibKey = Math.min(parseInt(a), parseInt(b)) + '_' + Math.max(parseInt(a), parseInt(b)) + '_sib';
                    if (!edgeSet[sibKey]) {
                        edgeSet[sibKey] = true;
                        edges.push({ group: 'edges', data: {
                            id: sibKey, source: a, target: b,
                            type: (sharedM && sharedF) ? 'sibling' : 'half-sibling'
                        }});
                    }
                }
            }
        }

        // ── Cytoscape erstellen ──────────────────────
        colaCy = cytoscape({
            container: document.getElementById('cola-cy'),
            elements: nodes.concat(edges),
            wheelSensitivity: 0.3,
            minZoom: 0.1,
            maxZoom: 3,
            style: getCytoscapeStyles(),
            layout: { name: 'preset' },
        });

        // ── Initiales Layout (cose für Startpositionen) ──
        colaCy.layout({
            name: 'cose', animate: false, padding: 60,
            nodeRepulsion: 480000, idealEdgeLength: 120,
            randomize: true, fit: true,
        }).run();

        // ── Cola-Physik starten (dynamisch) ──────────
        setTimeout(function() {
            colaCy.layout({
                name: 'cola',
                animate: true,
                refresh: 2,
                maxSimulationTime: 4000,
                ungrabifyWhileSimulating: false,
                fit: false,
                padding: 40,
                nodeSpacing: 25,
                edgeLength: function(e) {
                    var t = e.data('type');
                    if (t === 'married' || t === 'exmarried') return 60;
                    if (t === 'parent') return 100;
                    return 140;
                },
                randomize: false,
                avoidOverlap: true,
            }).run();
        }, 300);

        // ── Klick-Handler ────────────────────────────
        setupClickHandlers();
    }

    // ══════════════════════════════════════════════════
    // Klick-Handler
    // ══════════════════════════════════════════════════
    function setupClickHandlers() {
        // Klick auf Node
        colaCy.on('tap', 'node', function(e) {
            var node = e.target;
            var raw = node.data('raw') || {};
            var numId = parseInt(node.id());
            var person = allPersons.find(function(p) { return p.id === numId; });
            if (person) showPersonCard(person, 'details-content', 'details-hint');

            // Highlight
            colaCy.elements().removeClass('faded ring2');
            var firstRing = new Set([node.id()]);
            node.connectedEdges().not('.fam-hidden').forEach(function(edge) {
                var nb = edge.source().id() === node.id() ? edge.target() : edge.source();
                if (!nb.hasClass('fam-hidden')) firstRing.add(nb.id());
            });
            colaCy.nodes().not('.fam-hidden').forEach(function(n) {
                if (!firstRing.has(n.id())) n.addClass('faded');
            });
            colaCy.edges().not('.fam-hidden').forEach(function(edge) {
                if (!firstRing.has(edge.source().id()) || !firstRing.has(edge.target().id())) {
                    edge.addClass('faded');
                }
            });
        });

        // Klick auf Kante
        colaCy.on('tap', 'edge', function(e) {
            showEdgeCard(e.target, 'details-content', 'details-hint');
        });

        // Klick auf Hintergrund
        colaCy.on('tap', function(e) {
            if (e.target === colaCy) {
                colaCy.elements().removeClass('faded ring2');
                document.getElementById('details-hint').style.display = '';
                document.getElementById('details-content').innerHTML = '';
            }
        });
    }

    // ══════════════════════════════════════════════════
    // Familienfilter
    // ══════════════════════════════════════════════════
    function applyFamilyFilter() {
        if (!colaCy) return;
        if (!allFamilyNames || allFamilyNames.length === 0) return;

        colaCy.elements().removeClass('fam-hidden');
        if (activeFamilies.size >= allFamilyNames.length) return;

        colaCy.nodes().forEach(function(n) {
            var fn = n.data('family_name') || '';
            var mn = n.data('maiden_name') || '';
            if (!activeFamilies.has(fn) && !(mn && activeFamilies.has(mn))) {
                n.addClass('fam-hidden');
            }
        });
        colaCy.edges().forEach(function(e) {
            if (e.source().hasClass('fam-hidden') || e.target().hasClass('fam-hidden')) {
                e.addClass('fam-hidden');
            }
        });
    }
});
</script>
</body>
</html>
