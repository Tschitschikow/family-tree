<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zeitleiste – Bahrs Familie</title>
    <link rel="stylesheet" href="shared.css">

        /* ── Seiten-Layout ─────────────────────────────── */
        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* ── Toolbar ───────────────────────────────────── */
        #toolbar {
            background: #fff;
            border-bottom: 1px solid #e0e0e0;
            padding: 0.4em 1.2em;
            display: flex;
            align-items: center;
            gap: 0.8em;
            flex-shrink: 0;
            font-size: 0.85em;
        }
        .tool-btn {
            padding: 0.3em 0.8em;
            background: #fff;
            border: 1px solid #ccd;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.82em;
            font-family: inherit;
            color: #445;
        }
        .tool-btn:hover { background: #f0f2f5; }

        /* ── Hauptbereich: Legende | Graph | Details ──── */
        #main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* ── Legende links ─────────────────────────────── */
        #legend {
            width: 160px;
            min-width: 140px;
            flex-shrink: 0;
            background: #fff;
            border-right: 1px solid #e8e8e8;
            padding: 0.6em 0.7em;
            font-size: 0.78em;
            overflow-y: auto;
        }
        #legend h4 {
            font-size: 0.88em;
            font-weight: 600;
            color: #334;
            margin: 0 0 0.4em;
            padding-bottom: 0.3em;
            border-bottom: 1px solid #eef;
        }
        .legend-controls {
            display: flex;
            gap: 6px;
            margin-bottom: 0.4em;
        }
        .legend-ctrl-btn {
            flex: 1;
            font-size: 0.82em;
            padding: 0.2em 0.3em;
            background: #f0f2f5;
            border: 1px solid #dde;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            color: #445;
        }
        .legend-ctrl-btn:hover { background: #e4e8f0; }

        /* ── Graph-Bereich (Mitte) ─────────────────────── */
        #graph-area {
            flex: 1;
            position: relative;
            background: #f8f8f8;
        }
        #cy {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;

        }

        /* ── Details rechts ────────────────────────────── */
        #details {
            width: 270px;
            flex-shrink: 0;
            background: #fff;
            border-left: 1px solid #dde;
            padding: 1em;
            overflow-y: auto;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            font-size: 0.82em;
            color: #445;
        }
        #details h3 {
            font-size: 0.95em;
            font-weight: 600;
            color: #223;
            margin: 0 0 0.5em;
            border-bottom: 1px solid #eef;
            padding-bottom: 0.3em;
        }

        /* ── Statusbar ─────────────────────────────────── */
        #status { text-align: center; padding: 2em; color: #aaa; }
    </style>
</head>
<body>

<!-- ── Toolbar ──────────────────────────────────────── -->
<div id="toolbar">
    <span style="font-size:0.9em; color:#5a3e2b; font-weight:bold;">Generationenansicht</span>
    <button class="tool-btn" id="btn-refit">Neu anordnen</button>

<!-- ── Ladebalken ──────────────────────────────────── -->
<div id="status">Lade Stammbaum...</div>

<!-- ── Hauptbereich ────────────────────────────────── -->
<div id="main" style="display:none;">
    <!-- Legende links -->
    <div id="legend">
        <h4>🎨 Familiennamen</h4>
        <div class="legend-controls">
            <button class="legend-ctrl-btn" id="legend-all">Alle</button>

    <!-- Graph Mitte -->

        <div id="cy"></div>
    </div>

    <!-- Details rechts -->
    <div id="details">
        <h3>Details</h3>

<!-- ── Scripts ──────────────────────────────────────── -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
<script src="config.js"></script>
<script src="shared.js"></script>
<script>
/* ══════════════════════════════════════════════════════
   Zeitleiste – komplett neu aufgebaut
   ══════════════════════════════════════════════════════ */

window.addEventListener('load', function() {

    var cy = null;
    var showParent = true;
    var showMarried = true;
    var showSiblingsEdges = true;
    var PX_PER_YEAR = 8;
    var TL_MIN_YEAR = 1660;
    var TL_MAX_YEAR = 2025;
    var TL_PADDING = 80;

    // ── Schritt 1: Menü sofort aktiv ─────────────────
    setupLogout();
    setupViewMenu();

    // ── Schritt 2: Daten laden ───────────────────────
    initPage(function() {
        document.getElementById('status').style.display = 'none';
        document.getElementById('main').style.display = 'flex';

        // Schritt 3: Familienlegende aufbauen
        buildFamilyLegend('legend-items', 'legend-all', 'legend-none', function() {
            applyFamilyFilter();
        });

        // Schritt 4: Graph aufbauen
        buildGraph();

        // Schritt 5: Personenzähler
        updateCount();
    });

    // ══════════════════════════════════════════════════
    // Graph aufbauen
    // ══════════════════════════════════════════════════
    function buildGraph() {
        // ── Nodes ────────────────────────────────────
        var nodes = [];
        var edges = [];

        allPersons.forEach(function(p) {
            var birthYear = p.birth_date ? parseInt(p.birth_date.substring(0, 4)) : null;
            var fn = p.family_name || '';
            var gn = p.given_name || '';
            var label = gn + '\n' + fn;
            if (birthYear) label += '\n*' + birthYear;

            nodes.push({
                group: 'nodes',
                data: {
                    id: String(p.id),
                    label: label,
                    sex: p.sex,
                    family_name: p.family_name || '',
                    maiden_name: p.maiden_name || '',
                    birthYear: birthYear,
                    famColor: getFamilyColor(p.family_name),
                    birth_date: p.birth_date || '',
                    death_date: p.death_date || '',
                }
            });
        });

        // ── Edges ────────────────────────────────────
        var edgeSet = {};
        allRels.forEach(function(r) {
            var t = r.relationship_type;
            var src = String(r.person_id);
            var tgt = String(r.related_person_id);
            var key, etype;

            if (t === 'hasWife' || t === 'hasHusband') {
                key = Math.min(r.person_id, r.related_person_id) + '_' + Math.max(r.person_id, r.related_person_id) + '_m';
                etype = 'married';
            } else if (t === 'hasExWife' || t === 'hasExHusband') {
                key = Math.min(r.person_id, r.related_person_id) + '_' + Math.max(r.person_id, r.related_person_id) + '_ex';
                etype = 'exmarried';
            } else if (t === 'hasMother' || t === 'hasFather') {
                key = src + '_' + tgt + '_' + t;
                etype = 'parent';
                // Richtung: Kind → Elternteil
                src = String(r.person_id);
                tgt = String(r.related_person_id);
            } else {
                return;
            }

            if (edgeSet[key]) return;
            edgeSet[key] = true;
            edges.push({
                group: 'edges',
                data: { id: key, source: src, target: tgt, type: etype }
            });
        });

        // ── Cytoscape erstellen ──────────────────────
        cy = cytoscape({
            container: document.getElementById('cy'),
            elements: nodes.concat(edges),
            wheelSensitivity: 0.3,
            minZoom: 0.1,
            maxZoom: 3,
            style: [
                {
                    selector: 'node',
                    style: {
                        'label': 'data(label)',
                        'text-valign': 'center',
                        'text-halign': 'center',
                        'text-wrap': 'wrap',
                        'text-max-width': '90px',
                        'font-size': '7px',
                        'font-family': "'Helvetica Neue', Arial, sans-serif",
                        'color': '#333',
                        'background-color': '#ffffff',
                        'border-width': '2.5px',
                        'border-color': 'data(famColor)',
                        'width': '90px',
                        'height': '36px',
                    }
                },
                { selector: 'node[sex="m"]', style: { 'shape': 'round-rectangle' } },
                { selector: 'node[sex="f"]', style: { 'shape': 'ellipse' } },
                {
                    selector: 'edge',
                    style: {
                        'curve-style': 'bezier',
                        'width': 0.6,
                        'line-color': '#999',
                        'target-arrow-shape': 'none',
                        'opacity': 0.6,
                    }
                },
                { selector: 'edge[type="parent"]', style: { 'line-color': '#666', 'width': 0.6, 'target-arrow-shape': 'triangle', 'target-arrow-color': '#666', 'arrow-scale': 0.4 } },
                { selector: 'edge[type="married"]', style: { 'line-color': '#555', 'width': 1.5, 'line-style': 'solid' } },
                { selector: 'edge[type="exmarried"]', style: { 'line-color': '#aaa', 'width': 0.6, 'line-style': 'dashed' } },
                // Highlight-Klassen
                { selector: '.fam-hidden', style: { 'opacity': 0.03 } },
                { selector: '.faded',      style: { 'opacity': 0.05 } },
                { selector: '.ring2',      style: { 'opacity': 0.22 } },
            ],
        });

        // ── Timeline-Layout anwenden ─────────────────
        applyTimelineLayout();

        // ── Zeitleiste zeichnen ──────────────────────
        drawTimeline();

        // ── Zentrieren ───────────────────────────────
        setTimeout(function() { cy.fit(60); drawTimeline(); }, 300);

        // ── Klick-Handler ────────────────────────────
        setupClickHandlers();

        // ── Kanten-Sichtbarkeit ──────────────────────
        updateEdgeVisibility();

        // ── Viewport-Handler ────────────────────────
        setupViewportHandlers();
    }

    // ══════════════════════════════════════════════════
    // Timeline-Layout: Y = Geburtsjahr
    // ══════════════════════════════════════════════════
    function applyTimelineLayout() {
        var years = [];
        cy.nodes().forEach(function(n) {
            var y = n.data('birthYear');
            if (y) years.push(y);
        });
        if (years.length === 0) return;

        TL_MIN_YEAR = Math.min.apply(null, years);
        TL_MAX_YEAR = Math.max.apply(null, years);

        var avgYear = Math.round(years.reduce(function(a, b) { return a + b; }, 0) / years.length);

        // Y-Position: älteste oben, jüngste unten
        cy.nodes().forEach(function(n) {
            var year = n.data('birthYear') || avgYear;
            var y = TL_PADDING + (TL_MAX_YEAR - year) * PX_PER_YEAR;
            n.position('y', y);
        });

        // X: verbindungs-basierte Verteilung
        // Kinder nahe bei Eltern, Ehepaare nebeneinander
        var placed = {};    // id → x

        // Schritt B: Ehepaare finden
        var spouseOf = {};  // id → [spouse_ids]
        allRels.forEach(function(r) {
            if (r.relationship_type === 'hasWife' || r.relationship_type === 'hasHusband') {
                var a = String(r.person_id), b = String(r.related_person_id);
                if (!spouseOf[a]) spouseOf[a] = [];
                if (!spouseOf[b]) spouseOf[b] = [];
                if (spouseOf[a].indexOf(b) < 0) spouseOf[a].push(b);
                if (spouseOf[b].indexOf(a) < 0) spouseOf[b].push(a);
            }
        });

        // Schritt C: Eltern finden
        var parentOf = {};  // child_id → [parent_ids]
        allRels.forEach(function(r) {
            if (r.relationship_type === 'hasMother' || r.relationship_type === 'hasFather') {
                var child = String(r.person_id);
                var parent = String(r.related_person_id);
                if (!parentOf[child]) parentOf[child] = [];
                parentOf[child].push(parent);
            }
        });

        // Schritt D: X-Position zuweisen
        // Erst Personen ohne Eltern (Wurzeln), dann deren Kinder
        // Einfacher Hash für initiale X-Streuung
        function hashX(id) {
            var h = 0;
            var s = String(id);
            for (var i = 0; i < s.length; i++) h = s.charCodeAt(i) + ((h << 5) - h);
            return Math.abs(h) % 1600;
        }

        // Sortiere: älteste zuerst
        var sortedNodes = cy.nodes().sort(function(a, b) {
            return (a.data('birthYear') || 9999) - (b.data('birthYear') || 9999);
        });

        var slotRows = {};  // y-slot → nächste freie X-Position

        sortedNodes.forEach(function(n) {
            var id = n.id();
            if (placed[id]) return;

            var baseX;
            // Hat diese Person Eltern die schon platziert sind?
            var parents = parentOf[id] || [];
            var placedParents = parents.filter(function(pid) { return placed[pid]; });

            if (placedParents.length > 0) {
                // Unter den Eltern platzieren
                var sumX = 0;
                placedParents.forEach(function(pid) { sumX += placed[pid]; });
                baseX = sumX / placedParents.length;
            } else {
                // Streuung basierend auf ID
                baseX = hashX(id);
            }

            // Überlappung vermeiden
            var ySlot = Math.floor(n.position('y') / 45);
            if (!slotRows[ySlot]) slotRows[ySlot] = [];
            
            // Finde freie Position nahe baseX
            var occupied = slotRows[ySlot];
            var x = baseX;
            var tries = 0;
            while (occupied.some(function(ox) { return Math.abs(ox - x) < 105; }) && tries < 80) {
                x += 110;
                tries++;
            }
            
            n.position('x', x);
            placed[id] = x;
            occupied.push(x);

            // Ehepartner direkt daneben
            var spouses = spouseOf[id] || [];
            spouses.forEach(function(sid) {
                if (placed[sid]) return;
                var sNode = cy.getElementById(sid);
                if (!sNode || sNode.length === 0) return;
                var sx = x + 110;
                while (occupied.some(function(ox) { return Math.abs(ox - sx) < 105; })) {
                    sx += 110;
                }
                sNode.position('x', sx);
                placed[sid] = sx;
                occupied.push(sx);
            });
        });
    }

    // ══════════════════════════════════════════════════
    // Zeitleiste zeichnen (SVG Hintergrund)
    // ══════════════════════════════════════════════════
    function drawTimeline() {
        var svg = document.getElementById('tl-svg');
        if (!svg || !cy) return;

        // SVG leeren
        while (svg.firstChild) svg.removeChild(svg.firstChild);

        // Cytoscape-Viewport: pan und zoom
        var pan = cy.pan();
        var zoom = cy.zoom();
        var step = 25; // alle 25 Jahre eine Linie
        var startYear = Math.floor(TL_MIN_YEAR / step) * step - step;
        var endYear = Math.ceil(TL_MAX_YEAR / step) * step + step;
        var svgW = svg.clientWidth || 4000;

        for (var yr = startYear; yr <= endYear; yr += step) {
            // Y-Position im Cytoscape-Koordinatensystem
            var cyY = TL_PADDING + (TL_MAX_YEAR - yr) * PX_PER_YEAR;
            // Umrechnung in Screen-Koordinaten
            var screenY = cyY * zoom + pan.y;

            // Linie
            var line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', 0);
            line.setAttribute('x2', svgW);
            line.setAttribute('y1', screenY);
            line.setAttribute('y2', screenY);
            line.setAttribute('stroke', '#ddd');
            line.setAttribute('stroke-width', '0.5');
            line.setAttribute('stroke-dasharray', '6 4');
            svg.appendChild(line);

            // Jahreszahl
            var text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            text.setAttribute('x', 8);
            text.setAttribute('y', screenY - 3);
            text.setAttribute('fill', '#aaa');
            text.setAttribute('font-size', '10px');
            text.setAttribute('font-family', "'Helvetica Neue', Arial, sans-serif");
            text.textContent = yr;
            svg.appendChild(text);
        }
    }

    // ══════════════════════════════════════════════════
    // Pan/Zoom → Zeitleiste neu zeichnen
    // ══════════════════════════════════════════════════
    function setupViewportHandlers() {
        cy.on('pan zoom', function() { drawTimeline(); });
    }

    // ══════════════════════════════════════════════════
    // Klick-Handler
    // ══════════════════════════════════════════════════
    function setupClickHandlers() {
        // Klick auf Node: Highlight + Details
        cy.on('tap', 'node', function(e) {
            var node = e.target;
            var d = node.data();
            var numId = parseInt(d.id) || d.id;

            // Details anzeigen (shared.js)
            var person = allPersons.find(function(p) { return p.id === numId; });
            if (person) showPersonCard(person, 'details-content', 'details-hint');

            // Highlight: 1. Ring sichtbar, 2. Ring gedimmt, Rest ausgeblendet
            var firstRing = new Set([node.id()]);
            var secondRing = new Set();

            node.connectedEdges().not('.fam-hidden').forEach(function(edge) {
                var neighbor = edge.source().id() === node.id() ? edge.target() : edge.source();
                if (!neighbor.hasClass('fam-hidden')) {
                    firstRing.add(neighbor.id());
                    neighbor.connectedEdges().not('.fam-hidden').forEach(function(e2) {
                        var n2 = e2.source().id() === neighbor.id() ? e2.target() : e2.source();
                        if (!n2.hasClass('fam-hidden') && !firstRing.has(n2.id())) {
                            secondRing.add(n2.id());
                        }
                    });
                }
            });

            cy.nodes().not('.fam-hidden').forEach(function(n) {
                n.removeClass('faded ring2');
                if (firstRing.has(n.id())) { /* sichtbar */ }
                else if (secondRing.has(n.id())) { n.addClass('ring2'); }
                else { n.addClass('faded'); }
            });
            cy.edges().not('.fam-hidden').forEach(function(edge) {
                edge.removeClass('faded ring2');
                var sFirst = firstRing.has(edge.source().id());
                var tFirst = firstRing.has(edge.target().id());
                if (sFirst && tFirst) { /* sichtbar */ }
                else { edge.addClass('faded'); }
            });
        });

        // Klick auf Hintergrund: alles zurücksetzen
        cy.on('tap', function(e) {
            if (e.target === cy) {
                cy.elements().removeClass('faded ring2');
                document.getElementById('details-hint').style.display = '';
                document.getElementById('details-content').innerHTML = '';
            }
        });

        // Nur horizontales Verschieben: Y bleibt fest (Geburtsjahr)
        var dragStartY = null;
        cy.on('grab', 'node', function(e) {
            dragStartY = e.target.position('y');
        });
        cy.on('drag', 'node', function(e) {
            if (dragStartY !== null) {
                e.target.position('y', dragStartY);
            }
        });
        cy.on('free', 'node', function(e) {
            dragStartY = null;
            drawTimeline();
        });
    }

    // ══════════════════════════════════════════════════
    // Familienfilter
    // ══════════════════════════════════════════════════
    function applyFamilyFilter() {
        if (!cy) return;
        if (!allFamilyNames || allFamilyNames.length === 0) return;

        // Alle sichtbar machen
        cy.elements().removeClass('fam-hidden');

        // Alle Familien aktiv → fertig
        if (activeFamilies.size >= allFamilyNames.length) return;

        // Nicht-aktive verstecken
        cy.nodes().forEach(function(n) {
            var fn = n.data('family_name') || '';
            var mn = n.data('maiden_name') || '';
            if (!activeFamilies.has(fn) && !(mn && activeFamilies.has(mn))) {
                n.addClass('fam-hidden');
            }
        });
        cy.edges().forEach(function(e) {
            if (e.source().hasClass('fam-hidden') || e.target().hasClass('fam-hidden')) {
                e.addClass('fam-hidden');
            }
        });
    }

    // ══════════════════════════════════════════════════
    // Kanten-Sichtbarkeit (Checkboxen)
    // ══════════════════════════════════════════════════
    function updateEdgeVisibility() {
        if (!cy) return;
        cy.edges().forEach(function(e) {
            var t = e.data('type');
            if (t === 'parent') e.style('display', showParent ? 'element' : 'none');
            else if (t === 'married' || t === 'exmarried') e.style('display', showMarried ? 'element' : 'none');
        });
    }

    // ══════════════════════════════════════════════════
    // Personenzähler
    // ══════════════════════════════════════════════════
    function updateCount() {
        document.getElementById('person-count').textContent = allPersons.length + ' Personen';
    }

    // ══════════════════════════════════════════════════
    // Button-Handler
    // ══════════════════════════════════════════════════
    document.getElementById('btn-refit').addEventListener('click', function() {
        if (!cy) return;
        cy.elements().removeClass('faded ring2');
        applyTimelineLayout();
        applyFamilyFilter();
        cy.fit(60);
        setTimeout(drawTimeline, 100);
    });

    document.getElementById('show-parent').addEventListener('change', function() {
        showParent = this.checked;
        updateEdgeVisibility();
    });
    document.getElementById('show-married').addEventListener('change', function() {
        showMarried = this.checked;
        updateEdgeVisibility();
    });
    document.getElementById('show-siblings').addEventListener('change', function() {
        showSiblingsEdges = this.checked;
        updateEdgeVisibility();
    });
});
</script>
</body>
</html>
