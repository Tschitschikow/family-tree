<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register – Bahrs Familie</title>
    <link rel="stylesheet" href="shared.css">
    <style>
        body { display:flex; flex-direction:column; height:100vh; overflow:hidden; }
        #toolbar { background:#fff; border-bottom:1px solid #dde; padding:0.5em 1.2em; display:flex; align-items:center; gap:0.8em; flex-shrink:0; }
        #toolbar h2 { font-size:0.92em; font-weight:600; color:#334; margin:0; font-family:'Helvetica Neue',Arial,sans-serif; }
        #reg-search { padding:0.3em 0.7em; border:1px solid #ccd; border-radius:5px; font-size:0.82em; width:220px; font-family:inherit; color:#334; }
        #reg-search:focus { outline:none; border-color:#8899cc; }
        .reg-btn { padding:0.3em 0.8em; background:#fff; border:1px solid #ccd; border-radius:5px; cursor:pointer; font-size:0.8em; font-family:inherit; color:#445; }
        .reg-btn:hover { background:#f0f2f5; }
        #reg-count { font-size:0.78em; color:#99a; margin-left:auto; }
        #main { flex:1; display:flex; overflow:hidden; }
        #table-wrap { flex:1; overflow:auto; padding:0.8em; }
        table { width:100%; border-collapse:collapse; font-family:'Helvetica Neue',Arial,sans-serif; font-size:0.82em; background:#fff; box-shadow:0 1px 6px rgba(0,0,0,0.07); border-radius:6px; overflow:hidden; }
        th { background:#f0f2f5; color:#334; font-weight:600; padding:0.55em 0.8em; text-align:left; border-bottom:2px solid #dde; cursor:pointer; white-space:nowrap; user-select:none; }
        th:hover { background:#e8eaf0; }
        .sort-arrow { color:#aab; margin-left:3px; font-size:0.85em; }
        td { padding:0.45em 0.8em; border-bottom:1px solid #eef; color:#334; }
        tr:hover td { background:#f5f7fc; cursor:pointer; }
        tr.selected td { background:#eef2ff; }
        #card { width:270px; flex-shrink:0; background:#fff; border-left:1px solid #dde; padding:1em; overflow-y:auto; font-family:'Helvetica Neue',Arial,sans-serif; font-size:0.82em; color:#445; }
        #card h3 { font-size:0.95em; font-weight:600; color:#223; margin:0 0 0.5em; border-bottom:1px solid #eef; padding-bottom:0.3em; }
        .rc-lbl { color:#99a; font-size:0.85em; display:block; }
        .rc-val { color:#223; font-weight:500; }
        .rc-row { margin:0.3em 0; }
        #loading { text-align:center; padding:3em; color:#aaa; }
    </style>
</head>
<body>

<header>
    <h1>🌳 Bahrs Familienstammbaum</h1>
    <nav>
        <a href="admin.html" id="admin-btn">🔐 Admin</a>
        <div id="view-menu-wrap">
            <button id="view-menu-btn">Ansicht</button>
            <div id="view-dropdown">
                <div class="vd-item" data-view="timeline"><span class="vd-icon">📅</span> Zeitleiste</div>
                <div class="vd-item" data-view="network"><span class="vd-icon">🕸️</span> Dynamisches Netzwerk</div>
                <div class="vd-item" data-view="stammbaum"><span class="vd-icon">🌳</span> Klassischer Stammbaum</div>
                <div class="vd-item active-view" data-view="register"><span class="vd-icon">📋</span> Register</div>
                <div class="vd-item" data-view="karte"><span class="vd-icon">🗺️</span> Karte</div>
            </div>
        </div>
        <button id="logout-btn">Ausloggen</button>
    </nav>
</header>

<div id="toolbar">
    <h2>📋 Register</h2>
    <input type="text" id="reg-search" placeholder="Name, Beruf, Ort suchen…" autocomplete="off">
    <button class="reg-btn" id="reg-clear">✕ Leeren</button>
    <span id="reg-count"></span>
</div>

<div id="loading">Lade Daten...</div>

<div id="main" style="display:none;">
    <div id="table-wrap">
        <table>
            <thead><tr>
                <th data-col="display_name">Name <span class="sort-arrow">↕</span></th>
                <th data-col="maiden_name">Mädchenname <span class="sort-arrow">↕</span></th>
                <th data-col="sex">Geschl. <span class="sort-arrow">↕</span></th>
                <th data-col="birth_date">Geboren <span class="sort-arrow">↕</span></th>
                <th data-col="death_date">Gestorben <span class="sort-arrow">↕</span></th>
                <th data-col="birth_place">Geburtsort <span class="sort-arrow">↕</span></th>
                <th data-col="death_place">Sterbeort <span class="sort-arrow">↕</span></th>
                <th data-col="profession">Beruf <span class="sort-arrow">↕</span></th>
            </tr></thead>
            <tbody id="tbody"></tbody>
        </table>
    </div>
    <div id="card">
        <h3>Details</h3>
        <p id="card-hint" style="color:#bbc;font-style:italic;">Zeile anklicken.</p>
        <div id="card-content"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="shared.js"></script>
<script>
/* ── Register: eigene Logik ─────────────────────────── */
var sortCol = 'display_name', sortAsc = true, filter = '';

function render() {
    var q = filter.toLowerCase();
    var rows = allPersons.filter(function(p) {
        if (!q) return true;
        return (p.display_name||'').toLowerCase().includes(q) ||
               (p.maiden_name||'').toLowerCase().includes(q) ||
               (p.profession||'').toLowerCase().includes(q) ||
               (p.birth_place||'').toLowerCase().includes(q) ||
               (p.death_place||'').toLowerCase().includes(q);
    });
    rows.sort(function(a, b) {
        var av = a[sortCol]||'', bv = b[sortCol]||'';
        return sortAsc ? av.localeCompare(bv) : bv.localeCompare(av);
    });
    document.getElementById('reg-count').textContent = rows.length + ' Personen';
    var tbody = document.getElementById('tbody');
    tbody.innerHTML = '';
    rows.forEach(function(p) {
        var tr = document.createElement('tr');
        tr.innerHTML =
            '<td>'+(p.display_name||'–')+'</td>'+
            '<td>'+(p.maiden_name||'')+'</td>'+
            '<td>'+(p.sex==='m'?'♂':p.sex==='f'?'♀':'–')+'</td>'+
            '<td>'+(formatDateShort(p.birth_date,p.birth_date_estimated)||'–')+'</td>'+
            '<td>'+(formatDateShort(p.death_date,p.death_date_estimated)||'–')+'</td>'+
            '<td>'+(p.birth_place||'–')+'</td>'+
            '<td>'+(p.death_place||'–')+'</td>'+
            '<td>'+(p.profession||'–')+'</td>';
        tr.addEventListener('click', function() {
            document.querySelectorAll('#tbody tr').forEach(function(r){r.classList.remove('selected');});
            tr.classList.add('selected');
            showCard(p);
        });
        tbody.appendChild(tr);
    });
    document.querySelectorAll('th[data-col]').forEach(function(th) {
        var a = th.querySelector('.sort-arrow');
        if (!a) return;
        a.textContent = th.dataset.col===sortCol ? (sortAsc?'↑':'↓') : '↕';
        a.style.color = th.dataset.col===sortCol ? '#334' : '#aab';
    });
}

function showCard(p) {
    var pm = {}; allPersons.forEach(function(x){pm[x.id]=x;});
    var rels = allRels.filter(function(r){return r.person_id===p.id||r.related_person_id===p.id;})
        .sort(function(a,b){return a.id-b.id;});
    var relLines = rels.map(function(r) {
        var a = pm[r.person_id]?pm[r.person_id].display_name:'ID '+r.person_id;
        var b = pm[r.related_person_id]?pm[r.related_person_id].display_name:'ID '+r.related_person_id;
        return '<div class="rc-row"><span class="rc-val" style="font-size:0.88em;">'+a+' '+(relTypeDE[r.relationship_type]||r.relationship_type)+' '+b+'</span></div>';
    }).join('');
    function row(l,v){return '<div class="rc-row"><span class="rc-lbl">'+l+'</span><span class="rc-val">'+v+'</span></div>';}
    document.getElementById('card-hint').style.display='none';
    document.getElementById('card-content').innerHTML =
        row('Name',p.display_name||'–')+
        row('Geschlecht',p.sex==='m'?'männlich':p.sex==='f'?'weiblich':'–')+
        row('Mädchenname',p.maiden_name||'–')+
        row('Geboren',formatDateFull(p.birth_date,p.birth_date_estimated))+
        row('Geburtsort',p.birth_place||'–')+
        row('Gestorben',formatDateFull(p.death_date,p.death_date_estimated))+
        row('Sterbeort',p.death_place||'–')+
        row('Beruf',p.profession||'–')+
        '<div class="rc-row" style="margin-top:0.5em;border-top:1px solid #eef;padding-top:0.4em;">'+
        '<span class="rc-lbl">Person-ID: '+p.id+'</span><br>'+
        '<span class="rc-lbl">Rel-IDs: '+(rels.length?rels.map(function(r){return r.id;}).join(', '):'–')+'</span></div>'+
        '<div class="rc-row" style="margin-top:0.3em;"><span class="rc-lbl">Beziehungen:</span></div>'+relLines;
}

/* Event-Handler */
document.querySelectorAll('th[data-col]').forEach(function(th) {
    th.addEventListener('click', function() {
        if (sortCol===th.dataset.col) sortAsc=!sortAsc;
        else { sortCol=th.dataset.col; sortAsc=true; }
        render();
    });
});
document.getElementById('reg-search').addEventListener('input', function(){filter=this.value;render();});
document.getElementById('reg-clear').addEventListener('click', function(){document.getElementById('reg-search').value='';filter='';render();});

/* Init */
window.addEventListener('load', function() {
    setupLogout();
    setupViewMenu();
    initPage(function() {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('main').style.display = 'flex';
        render();
    });
});
</script>
</body>
</html>
